[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "la-otra-historia"
version = "0.3.0"
description = "Motor de producción de ficción sonora con narradores Juan y Carla"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "soundfile>=0.12", "scipy>=1.11"]
[project.optional-dependencies]
voice = ["qwen-tts", "torch"]
piper = ["piper-tts>=1.5.0"]
dev = ["pytest>=8"]
[project.scripts]
loh = "la_otra_historia.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
